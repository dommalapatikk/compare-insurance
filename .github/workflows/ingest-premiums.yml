name: Ingest premium catalogue

on:
  workflow_dispatch:
    inputs:
      replace_year:
        description: Replace the existing 2027 catalogue before upload
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify pinned BAG source files
        run: sha256sum --check data/SHA256SUMS
      - name: Install ingestion dependencies
        run: python -m pip install -e './backend[data]'
      - name: Validate and upload premium catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python backend/scripts/ingest_bag_to_supabase.py
          ${{ inputs.replace_year && '--replace-year' || '' }}
