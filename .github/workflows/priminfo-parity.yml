name: Priminfo parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  compare-official-prices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [standard, flex, praxis, tel_dig]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend'
      - name: Compare equivalent query with Priminfo
        run: python backend/scripts/check_priminfo_parity.py --model "${{ matrix.model }}"
