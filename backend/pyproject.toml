[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "compare-insurance-api"
version = "0.1.0"
description = "API for comparing Swiss mandatory health-insurance premiums."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=1.3.1,<2.0",
  "langchain-openai>=1.2.2,<2.0",
  "langgraph>=1.2.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
data = [
  "openpyxl>=3.1,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compare_insurance_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

